name: Cloudflare verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      initial_setup:
        description: First deployment only (create private replicas before their secrets exist)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc --project tsconfig.cloudflare.json --noEmit --incremental false
      - run: npm test
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare-runtime
      - run: npx wrangler deploy --dry-run -c infrastructure/cloudflare/wrangler.a.jsonc
      - run: npx wrangler deploy --dry-run -c infrastructure/cloudflare/wrangler.router.jsonc
      - run: npm run check:public
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.TRACKER_DATABASE_URL }}
      DATABASE_MIGRATION_URL: ${{ secrets.TRACKER_DATABASE_MIGRATION_URL }}
      TRACKER_SESSION_SECRET: ${{ secrets.TRACKER_SESSION_SECRET }}
      DATABASE_SSL_MODE: verify-full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - name: Create private services for first setup
        if: github.event_name == 'workflow_dispatch' && inputs.initial_setup
        run: |
          npx wrangler deploy -c infrastructure/cloudflare/wrangler.a.jsonc
          npx wrangler deploy -c infrastructure/cloudflare/wrangler.b.jsonc
      - name: Update private replica secrets
        shell: bash
        run: |
          set -euo pipefail
          for replica in a b; do
            python3 -c 'import json,os; print(json.dumps({k:os.environ[k] for k in ["DATABASE_URL","TRACKER_SESSION_SECRET"]}))' | npx wrangler secret bulk -c "infrastructure/cloudflare/wrangler.$replica.jsonc"
          done
      - name: Deploy both replicas and the router
        env:
          INITIAL_SETUP: ${{ github.event_name == 'workflow_dispatch' && inputs.initial_setup }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$INITIAL_SETUP" = "true" ]; then
            npm run deploy:cloudflare -- --initial
          else
            npm run deploy:cloudflare
          fi
