name: Deploy EC2
on:
  workflow_run:
    workflows: [Test and build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ec2-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.AWS_REGION != '' && vars.EC2_INSTANCE_ID != '' && vars.AWS_DEPLOY_ROLE_ARN != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy verified commit through Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, re
          sha = os.environ['DEPLOY_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          command = 'set -eu; cd /opt/lean-muscle-tracker; git fetch origin main; git checkout --detach ' + sha + '; export TRACKER_ENV_FILE=/opt/lean-muscle-tracker.env TRACKER_BIND_ADDRESS=0.0.0.0; docker compose build; if docker compose ps --status running --quiet | head -n 1 | grep -q .; then docker compose exec -T tracker node scripts/backup.mjs; fi; docker compose up -d --wait --wait-timeout 180; curl --fail http://localhost:5173/api/health'
          with open('/tmp/ssm-parameters.json','w') as f: json.dump({'commands':[command],'executionTimeout':['900']},f)
          PYCODE
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters file:///tmp/ssm-parameters.json --query Command.CommandId --output text)
          for attempt in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"; exit 1 ;;
            esac
            sleep 10
          done
          echo 'Deployment did not finish within the timeout.'
          exit 1
