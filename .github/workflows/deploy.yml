name: Deploy EC2
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ec2-production
  cancel-in-progress: false
jobs:
  deploy:
    # Retired: AWS account was closed. Retain the implementation for project history.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_IDS: ${{ vars.EC2_INSTANCE_IDS }}
      ALB_TARGET_GROUP_ARN: ${{ vars.ALB_TARGET_GROUP_ARN }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python3 .github/scripts/deploy_ec2.py
