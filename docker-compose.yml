services:
  tracker:
    image: lean-muscle-tracker:local
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ${TRACKER_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DATABASE_DRIVER: postgres
      DATABASE_AUTO_MIGRATE: '0'
    ports:
      - "${TRACKER_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db-tools:
    image: postgres:16-bookworm
    profiles: [tools]
    env_file:
      - ${TRACKER_ENV_FILE:-.env}
    volumes:
      - ${TRACKER_BACKUP_DIRECTORY:-/opt/lean-tracker-backups}:/backups
      - ./infrastructure/postgres:/tools:ro
    entrypoint: ["/bin/sh"]
    command: ["/tools/backup.sh"]
